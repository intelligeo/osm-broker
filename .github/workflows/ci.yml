name: CI

on:
  workflow_dispatch:  # disabled — trigger manually only if needed

jobs:
  # ── Backend: lint + test ─────────────────────────────────────────────────
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff pytest-asyncio httpx

      - name: Lint (ruff)
        run: ruff check backend/app backend/tests

      - name: Test (pytest)
        env:
          REDIS_URL: "redis://localhost:6379"   # non usato — mockato da conftest
          HOT_RAW_DATA_API_URL: "https://api-prod.raw-data.hotosm.org/v1"
          AUTH_ENABLED: "false"
          MAX_AREA_KM2: "500"
          QML_DIR: "resources/qstyles_swissmap"
          OUTPUT_DIR: "/tmp/osm_broker_test"
        run: pytest --tb=short

  # ── Frontend: type-check + build ─────────────────────────────────────────
  frontend:
    name: Frontend (Node)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: npm install

      - name: Type-check (tsc)
        run: npx tsc --noEmit

      - name: Build
        env:
          VITE_API_URL: "/api"
        run: npm run build
